backend:
  name: github
  repo: juniorsundar/kmsc-website
  branch: main
media_folder: public/media
public_folder: /media
media_library:
  max_file_size: 2048000
  folder_support: false
locale: en
publish_mode: simple
collections:
  - name: page-content
    label: Page Content
    files:
      - name: pages
        label: Site Settings and Pages
        file: content/page-content.json
        fields:
          - name: site
            label: Global Settings
            widget: object
            fields:
              - { name: legalName, label: Legal name, widget: string, hint: "Must be exactly: Kautilya Management System Consultancy Pvt. Ltd." }
              - { name: email, label: Public email, widget: string }
              - { name: cta, label: Primary call to action, widget: string, hint: "Must be exactly: Discuss Your Training Needs" }
              - name: author
                label: Default author
                widget: object
                fields:
                  - { name: name, label: Name, widget: string }
                  - { name: role, label: Role, widget: string }
              - { name: description, label: Default search description, widget: text }
              - { name: noindex, label: Exclude from search engines, widget: boolean }
              - { name: socialPreview, label: Social preview image, widget: image, hint: "Approved JPG, PNG, or WebP. Recommended 1200×630 pixels." }
              - { name: footerTagline, label: Footer tagline, widget: text }
          - name: home
            label: Home
            widget: object
            fields:
              - { name: eyebrow, label: Eyebrow text, widget: string }
              - { name: headline, label: Headline, widget: string }
              - { name: intro, label: Introduction, widget: text }
              - { name: servicesHeading, label: Services heading, widget: string }
              - { name: servicesIntro, label: Services introduction, widget: text }
          - name: about
            label: About
            widget: object
            fields:
              - { name: heading, label: Page heading, widget: string }
              - { name: intro, label: Introduction, widget: text }
              - { name: founderBio, label: Founder biography, widget: text, hint: "Restrained placeholder until approved copy is ready. Do not add fabricated claims, testimonials, or statistics." }
          - name: servicesPage
            label: Services page
            widget: object
            fields:
              - { name: heading, label: Page heading, widget: string }
              - { name: intro, label: Introduction, widget: text }
  - name: services
    label: Training Services
    folder: content/services
    extension: json
    format: json
    create: true
    identifier_field: name
    slug: "{{slug}}"
    fields:
      - { name: order, label: Display order, widget: number, value_type: int, min: 1, hint: "Lower numbers appear first. Use a unique number for each Training Service." }
      - { name: name, label: Service name, widget: string }
      - { name: summary, label: Summary, widget: text, hint: "A concise, accurate overview. Do not add unsupported outcomes, accreditations, statistics, or client claims." }
      - { name: description, label: Description, widget: text, hint: "Restrained placeholder or approved scope description. Do not add unsupported outcomes, accreditations, statistics, or client claims." }
  - name: blog
    label: Blog Posts
    folder: content/blog
    extension: json
    format: json
    create: true
    identifier_field: slug
    slug: "{{slug}}"
    fields:
      - { name: title, label: Title, widget: string, hint: "Use a clear, specific title for the Blog Post. Avoid unsupported outcomes, statistics, certifications, or client claims." }
      - { name: slug, label: URL slug, widget: string, hint: "Stable lowercase URL words separated by hyphens; must be unique. Changing it changes the public URL. Example: practical-iso-training" }
      - { name: summary, label: Summary, widget: text, hint: "A concise description shown on the Blog index and used as search metadata." }
      - { name: date, label: Publication date, widget: date, format: YYYY-MM-DD, hint: "Use the intended publication date, not the date you happen to edit the Blog Post." }
      - { name: cover, label: Cover image, widget: image, required: false, hint: "Optional Media Asset. Use an approved JPG, PNG, or WebP image only." }
      - { name: coverAlt, label: Cover image description, widget: string, required: false, hint: "Required when a cover image is provided. Describe the image for screen-reader users." }
      - { name: body, label: Body, widget: markdown, hint: "Write the approved Blog Post in clear paragraphs. Do not add fabricated case studies, testimonials, or claims." }
      - { name: tags, label: Tags, widget: list, required: false, hint: "Add a few relevant lowercase topics; leave empty if none are approved." }
      - { name: author, label: Blog Post byline, widget: string, default: Dr. Sundar Subramani, hint: "Default: Dr. Sundar Subramani. Do not repeat the Director, Principal Consultant role here." }
      - { name: noindex, label: Exclude from search engines, widget: boolean, default: true, hint: "Keep enabled while Page Content and the Blog Post are being prepared." }
