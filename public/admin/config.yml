backend:
  name: github
  repo: juniorsundar/kmsc-website
  branch: main
media_folder: public/media
public_folder: /media
locale: en
publish_mode: simple
collections:
  - name: page-content
    label: Page Content
    files:
      - name: pages
        label: Home and Site Settings
        file: content/page-content.json
        fields:
          - { name: site, label: Site settings, widget: object, fields: [ { name: legalName, widget: string }, { name: email, widget: string }, { name: cta, widget: string }, { name: author, label: Default author, widget: object, fields: [ { name: name, widget: string }, { name: role, widget: string } ] }, { name: description, widget: text }, { name: noindex, widget: boolean } ] }
          - { name: home, label: Home, widget: object, fields: [ { name: eyebrow, widget: string }, { name: headline, widget: string }, { name: intro, widget: text }, { name: servicesHeading, widget: string }, { name: servicesIntro, widget: text } ] }
          - { name: services, label: Training Services, widget: list, fields: [ { name: name, widget: string }, { name: description, widget: text } ] }
  - name: blog
    label: Blog Posts
    folder: content/blog
    extension: json
    format: json
    create: true
    slug: "{{slug}}"
    fields:
      - { name: title, widget: string }
      - { name: slug, widget: string, hint: Lowercase words separated by hyphens; must be unique. }
      - { name: summary, widget: text }
      - { name: date, widget: date, format: YYYY-MM-DD }
      - { name: cover, widget: image, required: false }
      - { name: body, widget: markdown }
      - { name: tags, widget: list, required: false }
      - { name: author, widget: string, default: Dr. Sundar Subramani }
      - { name: noindex, widget: boolean, default: true }
